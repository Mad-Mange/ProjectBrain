  <text x="1047" y="316" class="title">Useful anywhere</text><text x="995" y="362" class="copy">People review and verify</text><text x="995" y="383" class="copy">Agents search and propose</text><text x="995" y="404" class="copy">Codex · Copilot · Claude</text><rect x="995" y="421" width="117" height="20" rx="10" class="pill"/><text x="1008" y="435" class="pilltxt">MCP · LOOPBACK</text>
  <text x="74" y="510" class="kicker">CAPTURE</text><path d="M165 506h44" stroke="url(#glow)" stroke-width="2"/><text x="225" y="510" class="kicker">EXPLORE</text><path d="M330 506h44" stroke="url(#glow)" stroke-width="2"/><text x="390" y="510" class="kicker">TEST</text><path d="M453 506h44" stroke="url(#glow)" stroke-width="2"/><text x="513" y="510" class="kicker">REUSE</text>
