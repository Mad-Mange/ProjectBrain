<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="560" viewBox="0 0 1280 560" role="img" aria-labelledby="title desc">
<title id="title">ProjectBrain keeps local project knowledge connected to your AI tools</title>
<desc id="desc">A read-only project library feeds a private scanner and SQLite knowledge store. People and AI agents search knowledge, while experiments are reviewed by a person.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#102a24"/><stop offset="1" stop-color="#173d31"/></linearGradient>
  <linearGradient id="glow" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#d7e7a3"/><stop offset="1" stop-color="#8eb98c"/></linearGradient>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#071711" flood-opacity=".28"/></filter>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 10 5 0 10z" fill="#a8c68e"/></marker>
  <style>
    .ui{font-family:Inter,"Segoe UI",Arial,sans-serif}.kicker{font-size:12px;font-weight:700;letter-spacing:2.3px;fill:#c1d4a2}.head{font-size:34px;font-weight:650;letter-spacing:-.8px;fill:#f2f4e8}.sub{font-size:15px;fill:#bccbb9}.box{fill:#f8f9f2;stroke:#e2e9d8;stroke-width:1.4}.title{font-size:18px;font-weight:700;fill:#204534}.copy{font-size:13px;fill:#637566}.mini{font-size:11px;fill:#829182}.pill{fill:#e9f0de}.pilltxt{font-size:10px;font-weight:700;letter-spacing:.3px;fill:#456a48}.line{fill:none;stroke:#a8c68e;stroke-width:2.3;stroke-dasharray:6 7;marker-end:url(#arrow)}
  </style>
</defs>
<rect width="1280" height="560" rx="28" fill="url(#bg)"/>
<circle cx="1110" cy="92" r="176" fill="#8eaa6840"/><circle cx="1110" cy="92" r="125" fill="none" stroke="#d6e5b12a"/><circle cx="1110" cy="92" r="83" fill="none" stroke="#d6e5b12a"/>
<g class="ui"><text x="74" y="79" class="kicker">A PRIVATE KNOWLEDGE WORKSPACE</text><text x="74" y="127" class="head">Keep what you learn.</text><text x="74" y="168" class="head">Carry it into what’s next.</text><text x="76" y="205" class="sub">Your projects, ideas and tested solutions — connected locally.</text></g>
