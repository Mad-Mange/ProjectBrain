  <rect x="336" y="274" width="262" height="178" rx="16" class="box"/>
  <rect x="638" y="274" width="292" height="178" rx="16" class="box"/>
  <rect x="970" y="274" width="236" height="178" rx="16" class="box"/>
</g>
<path class="line" d="M298 362H326"/><path class="line" d="M598 362H628"/><path class="line" d="M930 362H960"/>
<g class="ui">
  <rect x="99" y="301" width="37" height="37" rx="10" fill="#e9f0de"/><path d="M109 312h18v16h-18zM113 307h10" fill="none" stroke="#4e7959" stroke-width="2" stroke-linecap="round"/>
  <text x="151" y="316" class="title">Your library</text><text x="99" y="362" class="copy">.NET · Python · JS/TS</text><text x="99" y="383" class="copy">Unity · Unreal · Blender</text><text x="99" y="404" class="copy">Docker · and more</text><rect x="99" y="421" width="99" height="20" rx="10" class="pill"/><text x="111" y="435" class="pilltxt">READ ONLY</text>
  <rect x="361" y="301" width="37" height="37" rx="10" fill="#e9f0de"/><path d="M369 319a11 11 0 0 1 18-8m1 0v7h-7M389 320a11 11 0 0 1-18 8m-1 0v-7h7" fill="none" stroke="#4e7959" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="413" y="316" class="title">Private scanner</text><text x="361" y="362" class="copy">Incremental inventory</text><text x="361" y="383" class="copy">Six-hour scans · weekly audit</text><text x="361" y="404" class="copy">No project code execution</text><rect x="361" y="421" width="115" height="20" rx="10" class="pill"/><text x="374" y="435" class="pilltxt">HASH + EVIDENCE</text>
  <rect x="663" y="301" width="37" height="37" rx="10" fill="#e9f0de"/><ellipse cx="681.5" cy="311.5" rx="10" ry="4.5" fill="none" stroke="#4e7959" stroke-width="2"/><path d="M672 312v14c0 5 19 5 19 0v-14M672 319c0 5 19 5 19 0" fill="none" stroke="#4e7959" stroke-width="2"/>
  <text x="715" y="316" class="title">Knowledge library</text><text x="663" y="362" class="copy">Quick Capture · FTS5 search</text><text x="663" y="383" class="copy">Ideas stay distinct from proof</text><text x="663" y="404" class="copy">Experiments keep their history</text><rect x="663" y="421" width="128" height="20" rx="10" class="pill"/><text x="676" y="435" class="pilltxt">SQLITE · LOCAL</text>
